name: Streamlit CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile app.py data.py

      - name: Data integrity check
        run: |
          python - <<'PY'
          import data
          assert len(data.MARKETS) == 100, f"Expected 100 markets, got {len(data.MARKETS)}"
          assert len(data.PRODUCTS) == 6, f"Expected 6 hero products, got {len(data.PRODUCTS)}"
          countries = [x[0] for x in data.MARKETS]
          assert len(countries) == len(set(countries)), "Duplicate market names detected"
          scores = [x[1] for x in data.MARKETS]
          assert all(isinstance(x, int) and 0 <= x <= 100 for x in scores), "Invalid market score"
          print("Data integrity OK")
          PY

      - name: Streamlit smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/style-streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              echo "Streamlit health check OK"
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/style-streamlit.log
          kill $APP_PID || true
          exit 1
